<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hieleras System - Standalone</title>

  <!-- Atrapador de Errores para evitar pantallas blancas -->
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      document.body.innerHTML = `
        <div style="background-color: #f8d7da; color: #721c24; padding: 20px; font-family: sans-serif; border-radius: 8px; margin: 20px;">
          <h3 style="font-weight: bold;">Error al cargar la aplicación:</h3>
          <p>${message}</p>
        </div>
      `;
    };
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel para compilar JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .loader-pulse { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body class="bg-slate-900">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- API DE GOOGLE SHEETS ---
    const API_URL = "https://script.google.com/macros/s/AKfycbyMOIUKh7WQgD6c74fOyeUcUnhN8D5ZUWiyErOb1ouaz4fyk2dZ7wF6tBzBJ57We3xy/exec";

    const fetchAPI = async (payloadObj) => {
      const response = await fetch(API_URL, {
        method: 'POST',
        redirect: 'follow', 
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payloadObj)
      });
      if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
      const text = await response.text();
      try {
        const json = JSON.parse(text);
        if (json.status === 'error') throw new Error(json.message);
        return json;
      } catch (e) {
        throw new Error(`Respuesta inválida del backend.`);
      }
    };

    const INITIAL_USERS = [
      { id: 'U-01', usuario: 'admin', password: 'admin', nombre: 'Administrador Local', rol: 'Superusuario' }
    ];

    const App = () => {
      const [view, setView] = useState('login'); 
      const [user, setUser] = useState(null);
      const [inventory, setInventory] = useState([]);
      const [incidents, setIncidents] = useState([]);
      const [stores, setStores] = useState([]);
      const [usersList, setUsersList] = useState(INITIAL_USERS);
      const [movements, setMovements] = useState([]);
      const [isAppLoading, setIsAppLoading] = useState(true); 
      const [loading, setLoading] = useState(false); 

      // --- DESCARGA DE DATOS ANTES DE INICIAR SESIÓN ---
      useEffect(() => {
        const initialLoad = async () => {
          try {
            const result = await fetchAPI({ action: 'getDashboard' });
            if (result && result.status === 'success') {
              if (result.users) setUsersList(result.users);
              if (result.data) setInventory(result.data);
              if (result.stores) setStores(result.stores);
              if (result.movements) setMovements(result.movements);
              if (result.incidents) setIncidents(result.incidents);
            }
          } catch (error) {
            console.warn("Fallo de red al inicio.", error);
          } finally {
            setIsAppLoading(false);
          }
        };
        initialLoad();
      }, []);

      const handleLogin = (e) => {
        e.preventDefault();
        const inputUser = e.target.username.value.trim();
        const inputPass = e.target.password.value.trim();
        
        const foundUser = usersList.find(u => 
          String(u.usuario).toLowerCase() === inputUser.toLowerCase() && 
          String(u.password) === inputPass
        );
        
        if (foundUser) {
          setUser({ name: foundUser.nombre, role: foundUser.rol, username: foundUser.usuario });
          setView(foundUser.rol === 'Operador' ? 'mobile' : 'dashboard');
        } else {
          alert("Credenciales incorrectas. Verifique su usuario y contraseña.");
        }
      };

      const refreshData = async () => {
        setLoading(true);
        try {
          const result = await fetchAPI({ action: 'getDashboard' });
          if (result && result.status === 'success') {
            if (result.data) setInventory(result.data);
            if (result.stores) setStores(result.stores);
            if (result.users) setUsersList(result.users);
            if (result.movements) setMovements(result.movements);
            if (result.incidents) setIncidents(result.incidents); 
          }
        } catch (error) {
          alert("Error de sincronización con Google Sheets.");
        } finally {
          setLoading(false);
        }
      };

      if (isAppLoading) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-slate-900">
            <div className="text-white text-center loader-pulse">
              <i className="fa-solid fa-spinner fa-spin text-5xl mb-6 text-blue-500"></i>
              <h2 className="text-xl font-black uppercase tracking-widest text-slate-300">Conectando a Base de Datos</h2>
            </div>
          </div>
        );
      }

      if (view === 'login') return <LoginScreen onLogin={handleLogin} />;

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 font-sans">
          <div className="fixed bottom-4 right-4 z-50 flex gap-2">
            <button 
              onClick={() => setView('mobile')}
              className={`p-3 rounded-full shadow-lg transition-all ${view === 'mobile' ? 'bg-orange-600 text-white' : 'bg-white text-orange-600 border border-orange-600'}`}
              title="Modo Handheld RF"
            >
              <i className="fa-solid fa-barcode text-xl"></i>
            </button>
            <button 
              onClick={() => setView('dashboard')}
              className={`p-3 rounded-full shadow-lg transition-all ${view === 'dashboard' ? 'bg-blue-600 text-white' : 'bg-white text-blue-600 border border-blue-600'}`}
              title="Dashboard PC"
            >
              <i className="fa-solid fa-chart-pie text-xl"></i>
            </button>
          </div>

          {view === 'mobile' ? 
            <MobileHandheld user={user} setView={setView} onUpdate={refreshData} stores={stores} inventory={inventory} setInventory={setInventory} incidents={incidents} setIncidents={setIncidents} /> : 
            <WebDashboard user={user} inventory={inventory} setInventory={setInventory} incidents={incidents} movements={movements} loading={loading} onRefresh={refreshData} setView={setView} stores={stores} setStores={setStores} usersList={usersList} setUsersList={setUsersList} />
          }
        </div>
      );
    };

    const LoginScreen = ({ onLogin }) => (
      <div className="flex items-center justify-center min-h-screen bg-slate-900 px-4">
        <div className="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border-t-8 border-blue-600">
          <div className="flex flex-col items-center mb-8">
            <div className="bg-blue-600 p-4 rounded-xl mb-4 shadow-lg text-white">
              <i className="fa-solid fa-truck text-4xl"></i>
            </div>
            <h1 className="text-2xl font-black text-slate-800 uppercase tracking-tighter">Hieleras System</h1>
            <p className="text-slate-500 text-sm font-medium">Control de Inventario RF</p>
          </div>
          <form onSubmit={onLogin} className="space-y-4">
            <div>
              <label className="block text-[10px] font-black text-slate-500 mb-1 uppercase tracking-widest">Identificador Usuario</label>
              <input name="username" type="text" placeholder="Ej. operador1" className="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all" required />
            </div>
            <div>
              <label className="block text-[10px] font-black text-slate-500 mb-1 uppercase tracking-widest">PIN de Acceso</label>
              <input name="password" type="password" placeholder="••••••••" className="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all" required />
            </div>
            <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl transition-all shadow-xl uppercase tracking-wider mt-4">
              Iniciar Sesión
            </button>
          </form>
        </div>
      </div>
    );

    const MobileHandheld = ({ user, setView, onUpdate, stores, inventory, setInventory, incidents, setIncidents }) => {
      const [screen, setScreen] = useState('menu'); 
      const [scannedItems, setScannedItems] = useState([]);
      const [inputCode, setInputCode] = useState('');
      const [selectedStore, setSelectedStore] = useState('');
      const [grupo, setGrupo] = useState(''); 
      const [entregas, setEntregas] = useState(''); 
      const [incidentType, setIncidentType] = useState('Dañada');
      const [incidentDesc, setIncidentDesc] = useState('');
      const [statusMessage, setStatusMessage] = useState(null);
      const [isSyncing, setIsSyncing] = useState(false);

      const addScan = (code) => {
        if (!code) return;
        const cleanCode = code.trim().toUpperCase();
        if (scannedItems.includes(cleanCode)) {
          setStatusMessage({ type: 'error', text: 'DUPLICADO' });
          return;
        }
        setScannedItems([...scannedItems, cleanCode]);
        setInputCode('');
        setStatusMessage({ type: 'success', text: `OK: ${cleanCode}` });
        setTimeout(() => setStatusMessage(null), 800);
      };

      const resetForm = () => {
        setScannedItems([]);
        setIncidentDesc('');
        setGrupo('');
        setEntregas('');
        setScreen('menu');
      };

      const handleConfirm = async () => {
        if (scannedItems.length === 0) return;
        setIsSyncing(true);
        setStatusMessage({ type: 'info', text: 'ENVIANDO...' });

        if (screen === 'incidencia') {
          try {
            const result = await fetchAPI({
              action: 'registrarIncidencia',
              payload: {
                tipo: incidentType === 'Dañada' ? 'Daño' : 'Pérdida',
                descripcion: incidentDesc || 'Reportado vía RF',
                usuario: user.name,
                activos: scannedItems
              }
            });
            if (result && result.status === 'success') {
              setStatusMessage({ type: 'success', text: 'REGISTRADO' });
              setTimeout(() => { resetForm(); onUpdate(); }, 1500);
            }
          } catch (e) {
            setStatusMessage({ type: 'error', text: 'ERROR' });
            alert(e.message);
          } finally { setIsSyncing(false); }
          return;
        }

        try {
          const result = await fetchAPI({
            action: 'registrarMovimiento',
            payload: {
              tipo: screen === 'salida' ? 'Salida' : 'Entrada',
              tienda: selectedStore || 'CEDIS',
              usuario: user.name,
              activos: scannedItems,
              grupo: screen === 'salida' ? grupo : '', 
              entregas: screen === 'salida' ? entregas : '' 
            }
          });
          if (result && result.status === 'success') {
            setStatusMessage({ type: 'success', text: 'GUARDADO' });
            setTimeout(() => { resetForm(); onUpdate(); }, 1500);
          }
        } catch (e) {
          setStatusMessage({ type: 'error', text: 'ERROR RED' });
          alert(e.message);
        } finally { setIsSyncing(false); }
      };

      return (
        <div className="max-w-md mx-auto h-screen bg-slate-950 flex flex-col text-white shadow-[0_0_50px_rgba(0,0,0,0.5)]">
          <div className="p-4 bg-slate-900 border-b-2 border-slate-800 flex justify-between items-center">
            <div>
              <p className="text-[10px] text-slate-500 font-black uppercase italic">Handheld Terminal</p>
              <h2 className="font-black text-xl tracking-tighter text-orange-500">
                {screen === 'menu' ? 'LOGÍSTICA' : screen === 'salida' ? 'DESPACHO' : 'RETORNO'}
              </h2>
            </div>
            <button onClick={() => window.location.reload()} className="p-2 bg-slate-800 rounded-lg text-slate-400">
              <i className="fa-solid fa-sign-out-alt text-xl"></i>
            </button>
          </div>

          <div className="flex-1 overflow-y-auto p-4 space-y-4">
            {statusMessage && (
              <div className={`p-5 rounded-xl font-black text-center text-2xl shadow-lg animate-pulse ${statusMessage.type === 'error' ? 'bg-red-600' : statusMessage.type === 'info' ? 'bg-blue-600' : 'bg-green-600'}`}>
                {statusMessage.text}
              </div>
            )}

            {screen === 'menu' && (
              <div className="flex flex-col gap-4 py-4">
                <button onClick={() => setScreen('salida')} className="bg-orange-600 p-6 rounded-3xl flex flex-col items-center gap-3 active:scale-95 shadow-[0_8px_0_rgb(154,52,18)] border-2 border-orange-400">
                  <i className="fa-solid fa-truck text-4xl"></i>
                  <span className="font-black text-xl">SALIDA TIENDA</span>
                </button>
                <button onClick={() => setScreen('entrada')} className="bg-blue-600 p-6 rounded-3xl flex flex-col items-center gap-3 active:scale-95 shadow-[0_8px_0_rgb(29,78,216)] border-2 border-blue-400">
                  <i className="fa-solid fa-box text-4xl"></i>
                  <span className="font-black text-xl">ENTRADA CEDIS</span>
                </button>
                <button onClick={() => setScreen('incidencia')} className="bg-red-600 p-6 rounded-3xl flex flex-col items-center gap-3 active:scale-95 shadow-[0_8px_0_rgb(185,28,28)] border-2 border-red-400">
                  <i className="fa-solid fa-circle-exclamation text-4xl"></i>
                  <span className="font-black text-xl">REPORTAR INCIDENCIA</span>
                </button>
              </div>
            )}

            {(screen === 'salida' || screen === 'entrada' || screen === 'incidencia') && (
              <div className="space-y-4">
                {screen === 'salida' && (
                  <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-4">
                    <select className="w-full bg-slate-800 p-4 rounded-xl border-2 border-slate-700 text-xl font-black outline-none focus:border-orange-500 appearance-none" onChange={(e) => setSelectedStore(e.target.value)} value={selectedStore}>
                      <option value="">-- ELIGE DESTINO --</option>
                      {stores.map((s, idx) => <option key={idx} value={s.nombre}>{s.nombre}</option>)}
                    </select>
                    <input type="text" value={grupo} onChange={(e) => setGrupo(e.target.value)} placeholder="Grupo(s) Ej. 1, 2" className="w-full bg-slate-800 p-4 rounded-xl border-2 border-slate-700 text-lg font-black outline-none focus:border-orange-500" />
                    <input type="text" value={entregas} onChange={(e) => setEntregas(e.target.value)} placeholder="Entrega(s) Ej. 4, 8" className="w-full bg-slate-800 p-4 rounded-xl border-2 border-slate-700 text-lg font-black outline-none focus:border-orange-500" />
                  </div>
                )}

                {screen === 'incidencia' && (
                  <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-4">
                    <select className="w-full bg-slate-800 p-4 rounded-xl border-2 border-slate-700 text-xl font-black focus:border-red-500 appearance-none text-red-400" onChange={(e) => setIncidentType(e.target.value)} value={incidentType}>
                      <option value="Dañada">Activo Dañado</option>
                      <option value="Perdida">Activo Perdido</option>
                    </select>
                    <input type="text" value={incidentDesc} onChange={(e) => setIncidentDesc(e.target.value)} placeholder="Detalles (Opcional)" className="w-full bg-slate-800 border-2 border-slate-700 p-3 rounded-xl font-bold focus:border-red-500 outline-none" />
                  </div>
                )}

                <div className="bg-slate-900 p-5 rounded-2xl border-2 border-slate-800">
                  <div className="flex justify-between items-center mb-2">
                    <label className={`text-[10px] font-black uppercase ${screen === 'incidencia' ? 'text-red-500' : 'text-orange-500'}`}>Esperando Escaneo...</label>
                    <i className={`fa-solid fa-barcode text-base animate-pulse ${screen === 'incidencia' ? 'text-red-500' : 'text-orange-500'}`}></i>
                  </div>
                  <input type="text" value={inputCode} onChange={(e) => setInputCode(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && addScan(inputCode)} className={`w-full bg-black border-2 border-slate-700 p-5 rounded-xl text-4xl font-mono font-bold outline-none uppercase tracking-widest ${screen === 'incidencia' ? 'text-red-400 focus:border-red-500' : 'text-green-400 focus:border-green-500'}`} autoFocus placeholder="..." />
                </div>

                <div className="space-y-2">
                  <div className="flex justify-between items-center px-1">
                    <h3 className="text-xs font-black text-slate-500 uppercase">Activos: {scannedItems.length}</h3>
                    <button onClick={() => setScannedItems([])} className="text-[10px] text-red-500 font-black uppercase underline">Limpiar</button>
                  </div>
                  <div className="bg-black/50 rounded-2xl max-h-[35vh] overflow-y-auto divide-y divide-slate-800 border border-slate-800">
                    {scannedItems.map((code, idx) => (
                      <div key={idx} className="p-4 flex justify-between items-center">
                        <span className="font-mono text-2xl font-black text-slate-200">{code}</span>
                        <i className="fa-solid fa-check-circle text-green-500 text-2xl"></i>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </div>

          {(screen === 'salida' || screen === 'entrada' || screen === 'incidencia') && (
            <div className="p-4 bg-slate-900 grid grid-cols-2 gap-4 border-t-2 border-slate-800">
              <button onClick={resetForm} disabled={isSyncing} className="p-5 bg-slate-800 font-black rounded-2xl uppercase text-xs disabled:opacity-50">ATRÁS</button>
              <button onClick={handleConfirm} disabled={scannedItems.length === 0 || (screen === 'salida' && !selectedStore) || isSyncing} className={`p-5 font-black rounded-2xl uppercase text-xs flex items-center justify-center gap-2 ${scannedItems.length > 0 && !isSyncing ? (screen === 'incidencia' ? 'bg-red-600' : 'bg-green-600') : 'bg-slate-700 text-slate-400'}`}>
                {isSyncing ? <i className="fa-solid fa-spinner fa-spin"></i> : 'GUARDAR'}
              </button>
            </div>
          )}
        </div>
      );
    const WebDashboard = ({ user, inventory, setInventory, incidents, movements, loading, onRefresh, setView, stores, setStores, usersList, setUsersList }) => {
      const [activeTab, setActiveTab] = useState('overview');
      const [searchTerm, setSearchTerm] = useState('');
      const [showModal, setShowModal] = useState(null); 
      const [isSaving, setIsSaving] = useState(false);

      const stats = useMemo(() => {
        const getStats = (isPlaca) => {
          const filtered = inventory.filter(i => {
             const idText = String(i.id || '').toUpperCase();
             const tipoText = String(i.tipo || '').toUpperCase();
             return isPlaca ? (tipoText.includes('PLACA') || idText.startsWith('P')) : (tipoText.includes('HIELERA') || idText.startsWith('H'));
          });
          return {
            total: filtered.length,
            enCedis: filtered.filter(i => String(i.estatus).toUpperCase() === 'CEDIS').length,
            enTienda: filtered.filter(i => String(i.estatus).toUpperCase() === 'EN TIENDA').length,
            dañadas: filtered.filter(i => {
              const estTexto = String(i.estatus).toLowerCase();
              return estTexto.includes('dañ') || estTexto.includes('perdid') || estTexto === 'daño';
            }).length
          };
        };
        return { hieleras: getStats(false), placas: getStats(true) };
      }, [inventory]);

      const zonesStock = useMemo(() => {
        const uniqueZones = [...new Set(stores.map(s => s.zona).filter(Boolean))];
        return uniqueZones.map(zona => {
          const sInZone = stores.filter(s => s.zona === zona).map(s => s.nombre);
          const stock = inventory.filter(i => sInZone.includes(i.ubicacion) && i.estatus === 'En Tienda').length;
          return { zona, stock };
        }).sort((a, b) => b.stock - a.stock);
      }, [stores, inventory]);

      const chartData = useMemo(() => {
        const map = {};
        movements.forEach(m => {
          if (!m.fecha) return;
          let rawDate = String(m.fecha).trim();
          let dateKey = "";
          const parts = rawDate.match(/(\d{1,4})[\/\-](\d{1,2})[\/\-](\d{1,4})/);
          if (parts) {
            let y = parts[1].length === 4 ? parts[1] : parts[3];
            let m_p = parts[1].length === 4 ? parts[2] : (parseInt(parts[2]) > 12 ? parts[1] : parts[2]);
            let d = parts[1].length === 4 ? parts[3] : (parseInt(parts[2]) > 12 ? parts[2] : parts[1]);
            dateKey = `${y}-${String(m_p).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          } else {
            const dObj = new Date(rawDate);
            if (!isNaN(dObj.getTime())) dateKey = `${dObj.getFullYear()}-${String(dObj.getMonth()+1).padStart(2, '0')}-${String(dObj.getDate()).padStart(2, '0')}`;
          }
          if (dateKey) {
            if (!map[dateKey]) map[dateKey] = { entradas: 0, salidas: 0 };
            const n = m.activos ? String(m.activos).split(',').filter(a=>a.trim()!=='').length : 0;
            if (m.tipo === 'Entrada') map[dateKey].entradas += n; else if (m.tipo === 'Salida') map[dateKey].salidas += n;
          }
        });
        const items = [];
        const endDate = new Date();
        for (let i = 11; i >= 0; i--) {
          const d = new Date(endDate); d.setDate(d.getDate() - i);
          const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
          const s = map[k] || { entradas: 0, salidas: 0 };
          items.push({ label: `${d.getDate()}/${d.getMonth()+1}`, ...s, total: s.entradas + s.salidas });
        }
        const max = Math.max(...items.map(d => Math.max(d.entradas, d.salidas)), 5);
        return items.map(d => ({ ...d, hIn: Math.max((d.entradas/max)*100, d.entradas>0?5:0), hOut: Math.max((d.salidas/max)*100, d.salidas>0?5:0) }));
      }, [movements]);

      const lS = searchTerm.toLowerCase();
      const filteredInventory = inventory.filter(i => String(i.id).toLowerCase().includes(lS) || String(i.tipo).toLowerCase().includes(lS));
      const filteredStores = stores.filter(s => String(s.nombre).toLowerCase().includes(lS) || String(s.zona).toLowerCase().includes(lS));
      const filteredUsers = usersList.filter(u => String(u.nombre).toLowerCase().includes(lS) || String(u.usuario).toLowerCase().includes(lS));
      const filteredIncidents = incidents.filter(i => String(i.activoId).toLowerCase().includes(lS));
      const filteredMovements = movements.filter(m => String(m.folio).toLowerCase().includes(lS) || String(m.tienda).toLowerCase().includes(lS));

      // --- FUNCIÓN DE EXPORTACIÓN A EXCEL (CSV) ---
      const handleDownloadExcel = () => {
        let dataToExport = [];
        let headers = [];
        let filename = `reporte_${activeTab}_${new Date().toISOString().split('T')[0]}.csv`;

        switch (activeTab) {
          case 'inventory':
            headers = ['ID Activo', 'Clasificación', 'Estatus Operativo', 'Ubicación Última'];
            dataToExport = filteredInventory.map(item => [item.id, item.tipo, item.estatus, item.ubicacion]);
            break;
          case 'stores':
            headers = ['ID Tienda', 'Nombre', 'Dirección', 'Zona'];
            dataToExport = filteredStores.map(s => [s.id, s.nombre, s.direccion, s.zona]);
            break;
          case 'users':
            headers = ['ID Usuario', 'Nombre Completo', 'Credencial', 'Nivel'];
            dataToExport = filteredUsers.map(u => [u.usuario, u.nombre, u.usuario, u.rol]);
            break;
          case 'incidents':
            headers = ['ID Incidencia', 'Activo', 'Tipo', 'Detalles', 'Fecha', 'Usuario'];
            dataToExport = filteredIncidents.map(inc => [inc.id, inc.activoId, inc.tipo, inc.descripcion, inc.fecha, inc.usuario]);
            break;
          case 'moves':
            headers = ['Folio de Operación', 'Fecha y Hora', 'Tipo', 'Destino / Origen', 'Usuario', 'Activos Movidos'];
            dataToExport = filteredMovements.map(m => [m.folio, m.fecha, m.tipo, m.tienda, m.usuario, m.activos]);
            break;
          default:
            alert('Ve a una pestaña con tabla para descargar el reporte.');
            return;
        }

        const csvContent = [
          headers.join(','),
          ...dataToExport.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
        ].join('\n');

        const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.setAttribute('href', url);
        link.setAttribute('download', filename);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="flex h-screen bg-slate-50 overflow-hidden w-full">
          <aside className="w-72 bg-slate-900 text-white flex flex-col shadow-2xl z-20">
            <div className="p-8 border-b border-slate-800">
              <div className="flex items-center gap-4">
                <div className="bg-blue-600 p-3 rounded-2xl shadow-lg"><i className="fa-solid fa-truck text-2xl"></i></div>
                <div><span className="font-black text-2xl uppercase block leading-none">Hieleras</span><span className="text-[10px] font-bold text-blue-500 uppercase tracking-widest">Admin Panel v2</span></div>
              </div>
            </div>
            <nav className="flex-1 p-6 space-y-3 overflow-y-auto">
              <NavItem icon={<i className="fa-solid fa-chart-pie"></i>} label="General" active={activeTab === 'overview'} onClick={() => {setActiveTab('overview'); setSearchTerm('');}} />
              <NavItem icon={<i className="fa-solid fa-box"></i>} label="Inventario" active={activeTab === 'inventory'} onClick={() => {setActiveTab('inventory'); setSearchTerm('');}} />
              <NavItem icon={<i className="fa-solid fa-store"></i>} label="Tiendas" active={activeTab === 'stores'} onClick={() => {setActiveTab('stores'); setSearchTerm('');}} />
              <NavItem icon={<i className="fa-solid fa-users"></i>} label="Usuarios" active={activeTab === 'users'} onClick={() => {setActiveTab('users'); setSearchTerm('');}} />
              <NavItem icon={<i className="fa-solid fa-circle-exclamation"></i>} label="Incidencias" active={activeTab === 'incidents'} onClick={() => {setActiveTab('incidents'); setSearchTerm('');}} />
              <NavItem icon={<i className="fa-solid fa-exchange-alt"></i>} label="Histórico" active={activeTab === 'moves'} onClick={() => {setActiveTab('moves'); setSearchTerm('');}} />
            </nav>
            <div className="p-6 border-t border-slate-800 space-y-4">
              <button onClick={onRefresh} disabled={loading} className="w-full flex items-center justify-center gap-3 p-4 bg-blue-600/10 text-blue-400 rounded-2xl text-xs font-black uppercase tracking-widest border border-blue-600/30 hover:bg-blue-600/20 disabled:opacity-50">
                {loading ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-sync"></i>} Sync Sheets
              </button>
              <div className="flex items-center justify-between p-4 bg-slate-800/40 rounded-2xl border border-slate-800">
                <div className="flex items-center gap-3 truncate">
                  <div className="w-10 h-10 shrink-0 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center font-black text-sm shadow-lg">{user.name.substring(0,2).toUpperCase()}</div>
                  <div className="truncate"><p className="font-black text-slate-200 text-sm truncate uppercase">{user.name}</p><p className="text-[10px] text-slate-500 font-bold uppercase">{user.role}</p></div>
                </div>
                <button onClick={() => window.location.reload()} className="p-2 text-slate-400 hover:text-red-400"><i className="fa-solid fa-sign-out-alt"></i></button>
              </div>
            </div>
          </aside>

          <main className="flex-1 p-10 overflow-y-auto">
            {/* --- CABECERA DINÁMICA CON BOTONES --- */}
            <header className="flex justify-between items-end mb-10">
              <div>
                <h1 className="text-4xl font-black text-slate-900 uppercase tracking-tighter leading-none mb-2">
                  {activeTab === 'overview' && 'Resumen de Flota'}
                  {activeTab === 'inventory' && 'Inventario Activo'}
                  {activeTab === 'stores' && 'Catálogo de Tiendas'}
                  {activeTab === 'users' && 'Gestión de Usuarios'}
                  {activeTab === 'incidents' && 'Registro de Incidencias'}
                  {activeTab === 'moves' && 'Bitácora Logística'}
                </h1>
              </div>
              <div className="flex gap-4">
                <button onClick={handleDownloadExcel} className="bg-white border-2 border-slate-200 text-slate-700 px-6 py-3 rounded-xl font-bold shadow-sm hover:bg-slate-50 transition-all flex items-center gap-2">
                  <i className="fa-solid fa-download"></i> EXPORTAR CSV
                </button>
                {activeTab === 'inventory' && (
                  <button onClick={() => setShowModal('item')} className="bg-slate-900 text-white px-6 py-3 rounded-xl font-bold shadow-xl hover:bg-slate-800 transition-all flex items-center gap-2">
                    <i className="fa-solid fa-plus"></i> NUEVO ACTIVO
                  </button>
                )}
                {activeTab === 'stores' && (
                  <button onClick={() => setShowModal('store')} className="bg-slate-900 text-white px-6 py-3 rounded-xl font-bold shadow-xl hover:bg-slate-800 transition-all flex items-center gap-2">
                    <i className="fa-solid fa-plus"></i> NUEVA TIENDA
                  </button>
                )}
                {activeTab === 'users' && (
                  <button onClick={() => setShowModal('user')} className="bg-slate-900 text-white px-6 py-3 rounded-xl font-bold shadow-xl hover:bg-slate-800 transition-all flex items-center gap-2">
                    <i className="fa-solid fa-plus"></i> NUEVO USUARIO
                  </button>
                )}
              </div>
            </header>

            {activeTab === 'overview' && (
              <div className="space-y-10">
                <div className="space-y-4">
                  <h3 className="font-black text-slate-500 uppercase text-xs flex items-center gap-2"><i className="fa-solid fa-box text-blue-500"></i> Resumen de Hieleras</h3>
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-8">
                    <StatCard label="Total Hieleras" value={stats.hieleras.total} icon={<i className="fa-solid fa-box text-blue-600 text-2xl"></i>} color="blue" />
                    <StatCard label="Stock CEDIS" value={stats.hieleras.enCedis} icon={<i className="fa-solid fa-check-circle text-green-600 text-2xl"></i>} color="green" />
                    <StatCard label="En Tiendas" value={stats.hieleras.enTienda} icon={<i className="fa-solid fa-truck text-orange-600 text-2xl"></i>} color="orange" />
                    <StatCard label="Fuera Servicio" value={stats.hieleras.dañadas} icon={<i className="fa-solid fa-exclamation-triangle text-red-600 text-2xl"></i>} color="red" />
                  </div>
                </div>
                <div className="space-y-4">
                  <h3 className="font-black text-slate-500 uppercase text-xs flex items-center gap-2"><i className="fa-solid fa-box text-indigo-500"></i> Resumen de Placas</h3>
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-8">
                    <StatCard label="Total Placas" value={stats.placas.total} icon={<i className="fa-solid fa-box text-indigo-600 text-2xl"></i>} color="blue" />
                    <StatCard label="Stock CEDIS" value={stats.placas.enCedis} icon={<i className="fa-solid fa-check-circle text-green-600 text-2xl"></i>} color="green" />
                    <StatCard label="En Tiendas" value={stats.placas.enTienda} icon={<i className="fa-solid fa-truck text-orange-600 text-2xl"></i>} color="orange" />
                    <StatCard label="Fuera Servicio" value={stats.placas.dañadas} icon={<i className="fa-solid fa-exclamation-triangle text-red-600 text-2xl"></i>} color="red" />
                  </div>
                </div>
                <div className="grid grid-cols-3 gap-10">
                  <div className="col-span-2 bg-white p-10 rounded-3xl border-2 shadow-sm">
                    <div className="flex justify-between items-start mb-10">
                      <h3 className="font-black uppercase text-xl italic">Volumen por Fecha</h3>
                      <div className="flex gap-4">
                        <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-green-500"></span><span className="text-[10px] font-bold text-slate-500 uppercase">Entradas</span></div>
                        <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-orange-500"></span><span className="text-[10px] font-bold text-slate-500 uppercase">Salidas</span></div>
                      </div>
                    </div>
                    <div className="h-72 flex items-end justify-between gap-4 px-4">
                      {chartData.map((d, i) => (
                        <div key={i} className="flex-1 flex flex-col items-center gap-3 group relative h-full">
                          <div className="w-full flex items-end justify-center h-full gap-1">
                            {d.total > 0 && <div className="absolute -top-12 bg-slate-900 text-white text-[10px] py-1 px-2 rounded opacity-0 group-hover:opacity-100 whitespace-nowrap z-20">In: {d.entradas} <br/>Out: {d.salidas}</div>}
                            <div className="w-full bg-green-500 rounded-t-md transition-all duration-1000" style={{ height: `${d.hIn}%` }}></div>
                            <div className="w-full bg-orange-500 rounded-t-md transition-all duration-1000" style={{ height: `${d.hOut}%` }}></div>
                          </div>
                          <span className="text-[10px] font-black text-slate-400 uppercase">{d.label}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                  <div className="bg-white p-10 rounded-3xl border-2 shadow-sm">
                    <h3 className="font-black uppercase text-xl italic mb-8">Stock por Zona</h3>
                    <div className="space-y-8 max-h-64 overflow-y-auto">
                      {zonesStock.map((z, i) => (
                        <div key={i} className="space-y-3">
                          <div className="flex justify-between text-[11px] font-black uppercase"><span className="text-slate-600">Zona {z.zona}</span><span className="text-blue-600">{z.stock} UNI</span></div>
                          <div className="h-3 bg-slate-50 rounded-full border"><div className="h-full bg-blue-600 rounded-full" style={{ width: `${Math.max((z.stock/Math.max(...zonesStock.map(s=>s.stock)))*100, 5)}%` }}></div></div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {activeTab !== 'overview' && (
              <div className="bg-white rounded-3xl border-2 shadow-sm overflow-hidden">
                <div className="p-8 bg-slate-50/50"><input value={searchTerm} onChange={(e)=>setSearchTerm(e.target.value)} placeholder="Buscar..." className="w-full p-4 border-2 rounded-2xl outline-none focus:border-blue-600 font-bold text-slate-700" /></div>
                <div className="overflow-x-auto">
                  <table className="w-full text-left">
                    <thead className="bg-slate-50 text-[10px] uppercase font-black text-slate-400 border-b-2">
                      <tr>
                        {activeTab==='inventory' && <><th className="p-6">ID Activo</th><th className="p-6">Tipo</th><th className="p-6">Estatus</th><th className="p-6">Ubicación</th></>}
                        {activeTab==='stores' && <><th className="p-6">ID Tienda</th><th className="p-6">Nombre</th><th className="p-6">Zona</th></>}
                        {activeTab==='users' && <><th className="p-6">Usuario</th><th className="p-6">Nombre</th><th className="p-6">Rol</th></>}
                        {activeTab==='incidents' && <><th className="p-6">ID Incid.</th><th className="p-6">Activo</th><th className="p-6">Tipo</th><th className="p-6">Fecha</th></>}
                        {activeTab==='moves' && <><th className="p-6">Folio</th><th className="p-6">Fecha</th><th className="p-6">Tipo</th><th className="p-6">Destino</th><th className="p-6">Operador</th><th className="p-6">Activos</th><th className="p-6">PDF</th></>}
                      </tr>
                    </thead>
                    <tbody className="divide-y-2 divide-slate-50 text-sm">
                      {activeTab==='inventory' && filteredInventory.map((i, idx) => (
                        <tr key={idx} className="hover:bg-blue-50/40"><td className="p-6 font-mono font-black text-blue-700 text-lg">{i.id}</td><td className="p-6 font-bold uppercase">{i.tipo}</td><td className="p-6"><span className="px-3 py-1 rounded bg-slate-100 font-black text-[10px]">{i.estatus}</span></td><td className="p-6 font-bold text-slate-500">{i.ubicacion}</td></tr>
                      ))}
                      {activeTab==='stores' && filteredStores.map((s, idx) => (
                        <tr key={idx} className="hover:bg-blue-50/40"><td className="p-6 font-mono font-black">{s.id}</td><td className="p-6 font-bold uppercase">{s.nombre}</td><td className="p-6"><span className="px-3 py-1 rounded bg-slate-100 font-black text-[10px]">{s.zona}</span></td></tr>
                      ))}
                      {activeTab==='users' && filteredUsers.map((u, idx) => (
                        <tr key={idx} className="hover:bg-blue-50/40"><td className="p-6 font-mono font-black text-blue-600">{u.usuario}</td><td className="p-6 font-bold uppercase">{u.nombre}</td><td className="p-6 font-bold text-slate-500">{u.rol}</td></tr>
                      ))}
                      {activeTab==='incidents' && filteredIncidents.map((inc, idx) => (
                        <tr key={idx} className="hover:bg-red-50/40"><td className="p-6 font-mono font-black text-red-600">{inc.id}</td><td className="p-6 font-bold uppercase">{inc.activoId}</td><td className="p-6"><span className="px-3 py-1 rounded bg-red-100 text-red-600 font-black text-[10px]">{inc.tipo}</span></td><td className="p-6 font-bold text-slate-500">{inc.fecha}</td></tr>
                      ))}
                      
                      {/* AQUÍ SE APLICA EL ORDEN INVERTIDO PARA LOS MOVIMIENTOS */}
                      {activeTab==='moves' && [...filteredMovements].reverse().map((m, idx) => (
                        <tr key={idx} className="hover:bg-blue-50/40">
                          <td className="p-6 font-mono font-black text-slate-700">{m.folio}</td>
                          <td className="p-6 font-bold text-slate-500 text-xs">{m.fecha}</td>
                          <td className="p-6"><span className={`px-3 py-1 rounded text-[10px] font-black uppercase ${m.tipo==='Salida'?'bg-orange-100 text-orange-600':'bg-blue-100 text-blue-600'}`}>{m.tipo}</span></td>
                          <td className="p-6 font-bold uppercase text-xs">{m.tienda}</td>
                          <td className="p-6 font-bold uppercase text-xs text-slate-500">{m.usuario}</td>
                          <td className="p-6 font-mono text-blue-600 text-[10px] max-w-[150px] truncate">{m.activos}</td>
                          <td className="p-6">{m.pdf && m.pdf.startsWith('http') ? <a href={m.pdf} target="_blank" className="text-blue-500 font-black text-[10px] underline">VER VALE</a> : '-'}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* MODALES DE CREACIÓN DE REGISTROS */}
            {showModal && (
              <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50">
                <div className="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl border-4 border-slate-100">
                  <div className="flex justify-between items-center mb-8">
                    <h2 className="text-2xl font-black text-slate-900 uppercase tracking-tighter">
                      {showModal === 'item' && 'Registrar Activo'}
                      {showModal === 'store' && 'Alta de Tienda'}
                      {showModal === 'user' && 'Nuevo Usuario'}
                    </h2>
                    <button onClick={() => setShowModal(null)} className="p-2 bg-slate-100 text-slate-500 rounded-xl hover:bg-slate-200 hover:text-red-500 transition-colors">
                      <i className="fa-solid fa-times text-xl"></i>
                    </button>
                  </div>

                  {showModal === 'item' && (
                    <form className="space-y-5" onSubmit={async (e) => {
                      e.preventDefault();
                      if (isSaving) return;
                      const newId = e.target.id.value.toUpperCase();
                      if (inventory.some(item => item.id === newId)) {
                        alert(`Error: El activo con ID "${newId}" ya existe.`);
                        return;
                      }
                      setIsSaving(true);
                      const nuevoActivo = { id: newId, tipo: e.target.tipo.value, estatus: 'CEDIS', ubicacion: 'Almacén Principal' };
                      try {
                        const result = await fetchAPI({ action: 'registrarActivo', payload: nuevoActivo });
                        if (result && result.status === 'success') {
                          setInventory([nuevoActivo, ...inventory]);
                          setShowModal(null);
                        }
                      } catch (error) { alert(`❌ Error: ${error.message}`); } 
                      finally { setIsSaving(false); }
                    }}>
                      <div>
                        <label className="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">ID Único (Ej. H-1005 o P-5003)</label>
                        <input name="id" required className="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-xl font-mono uppercase focus:border-blue-500 outline-none font-bold" placeholder="H-XXXX" />
                      </div>
                      <div>
                        <label className="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Clasificación</label>
                        <select name="tipo" className="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-blue-500 outline-none font-bold">
                          <option>Hielera</option>
                          <option>Placa</option>
                        </select>
                      </div>
                      <button type="submit" disabled={isSaving} className="w-full flex items-center justify-center gap-2 py-4 bg-blue-600 text-white rounded-xl font-black uppercase tracking-widest mt-6 hover:bg-blue-700 disabled:opacity-50">
                        {isSaving ? <i className="fa-solid fa-spinner fa-spin"></i> : 'Guardar Activo'}
                      </button>
                    </form>
                  )}

                  {showModal === 'store' && (
                    <form className="space-y-5" onSubmit={async (e) => {
                      e.preventDefault();
                      if (isSaving) return;
                      setIsSaving(true);
                      const newStore = { id: `T-0${stores.length + 1}`, nombre: e.target.nombre.value, direccion: e.target.direccion.value, zona: e.target.zona.value };
                      try {
                        const result = await fetchAPI({ action: 'registrarTienda', payload: newStore });
                        if (result && result.status === 'success') {
                          setStores([...stores, newStore]);
                          setShowModal(null);
                        }
                      } catch (error) { alert(`❌ Error: ${error.message}`); } 
                      finally { setIsSaving(false); }
                    }}>
                      <div>
                        <label className="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Nombre de Sucursal</label>
                        <input name="nombre" required className="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-blue-500 outline-none font-bold" placeholder="Ej. OXXO Centro" />
                      </div>
                      <div>
                        <label className="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Dirección</label>
                        <input name="direccion" required className="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-blue-500 outline-none font-medium" placeholder="Calle..." />
                      </div>
                      <div>
                        <label className="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Zona</label>
                        <select name="zona" className="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-blue-500 outline-none font-bold">
                          <option>Norte</option><option>Sur</option><option>Centro</option><option>Oriente</option><option>Poniente</option>
                        </select>
                      </div>
                      <button type="submit" disabled={isSaving} className="w-full flex items-center justify-center gap-2 py-4 bg-blue-600 text-white rounded-xl font-black uppercase tracking-widest mt-6 hover:bg-blue-700 disabled:opacity-50">
                        {isSaving ? <i className="fa-solid fa-spinner fa-spin"></i> : 'Registrar Tienda'}
                      </button>
                    </form>
                  )}

                  {showModal === 'user' && (
                    <form className="space-y-5" onSubmit={async (e) => {
                      e.preventDefault();
                      if (isSaving) return;
                      setIsSaving(true);
                      const newUser = { id: `U-0${usersList.length + 1}`, usuario: e.target.usuario.value, password: e.target.password.value, nombre: e.target.nombre.value, rol: e.target.rol.value };
                      try {
                        const result = await fetchAPI({ action: 'registrarUsuario', payload: newUser });
                        if (result && result.status === 'success') {
                          setUsersList([...usersList, newUser]);
                          setShowModal(null);
                        }
                      } catch (error) { alert(`❌ Error: ${error.message}`); } 
                      finally { setIsSaving(false); }
                    }}>
                      <div>
                        <label className="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Nombre Real</label>
                        <input name="nombre" required className="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-blue-500 outline-none font-bold" placeholder="Ej. Carlos" />
                      </div>
                      <div>
                        <label className="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Usuario Login</label>
                        <input name="usuario" required className="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-xl font-mono focus:border-blue-500 outline-none font-bold" placeholder="cmartinez" />
                      </div>
                      <div>
                        <label className="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Contraseña</label>
                        <input name="password" type="password" required className="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-blue-500 outline-none font-bold" placeholder="••••••••" />
                      </div>
                      <div>
                        <label className="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Rol</label>
                        <select name="rol" className="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-blue-500 outline-none font-bold">
                          <option>Operador</option><option>Superusuario</option>
                        </select>
                      </div>
                      <button type="submit" disabled={isSaving} className="w-full flex items-center justify-center gap-2 py-4 bg-blue-600 text-white rounded-xl font-black uppercase tracking-widest mt-6 hover:bg-blue-700 disabled:opacity-50">
                        {isSaving ? <i className="fa-solid fa-spinner fa-spin"></i> : 'Crear Usuario'}
                      </button>
                    </form>
                  )}
                </div>
              </div>
            )}

          </main>
        </div>
      );
    };

    const NavItem = ({ icon, label, active, onClick }) => (
      <button onClick={onClick} className={`w-full flex items-center gap-5 px-6 py-5 rounded-2xl font-black transition-all text-sm uppercase tracking-widest ${active ? 'bg-blue-600 text-white shadow-xl translate-x-2' : 'text-slate-500 hover:bg-slate-800'}`}>
        {icon} <span>{label}</span>
      </button>
    );

    const StatCard = ({ label, value, icon, color }) => {
      const c = { blue: 'border-l-blue-600', green: 'border-l-green-600', orange: 'border-l-orange-600', red: 'border-l-red-600' };
      return (
        <div className={`bg-white p-8 rounded-3xl border-l-[10px] shadow-sm border-y border-r border-slate-100 ${c[color]}`}>
          <div className="flex justify-between items-start">
            <div><p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">{label}</p><p className="text-4xl font-black">{value}</p></div>
            <div className="p-4 bg-slate-50 rounded-xl">{icon}</div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
